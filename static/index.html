<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epilogg</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<meta name="theme-color" content="#14161b">
<style>
  :root {
    --bg: #14161b; --panel: #1d2027; --panel2: #262a33; --line: #323743;
    --text: #e6e8ec; --muted: #9aa1ad; --accent: #7aa2ff; --good: #5fcf8a; --mid: #e6c35c; --bad: #e57373;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 20px 24px 8px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  h1 { font-size: 22px; margin: 0 auto 0 0; display: flex; align-items: center; gap: 10px; }
  h1 img { width: 30px; height: 30px; }
  button, select, input, textarea {
    font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 11px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0d1220; font-weight: 600; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  a { color: var(--accent); }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; padding: 8px 24px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; min-width: 130px; }
  .tile b { display: block; font-size: 24px; }
  .tile span { color: var(--muted); font-size: 13px; }
  .years { display: flex; align-items: flex-end; gap: 6px; height: 90px; padding: 10px 16px 0; flex: 1; min-width: 260px; }
  .years div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; }
  .years i { display: block; width: 100%; max-width: 34px; background: var(--accent); border-radius: 4px 4px 0 0; opacity: .75; }
  .years div.sel i, .years div:hover i { opacity: 1; }
  .years small { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .years em { font-style: normal; font-size: 11px; color: var(--muted); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 24px; }
  .filters input[type=search] { flex: 1; min-width: 200px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; padding: 8px 24px 40px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
  .card:hover { border-color: var(--accent); }
  .cover { aspect-ratio: 3/4; background: var(--panel2) center/cover no-repeat; position: relative; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; text-align: center; padding: 8px; }
  .score { position: absolute; top: 6px; right: 6px; background: rgba(10,12,16,.85); border-radius: 6px; padding: 2px 7px; font-weight: 700; font-size: 14px; }
  .meta { padding: 8px 10px 10px; }
  .meta .t { font-weight: 600; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta .s { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .plat { position: absolute; top: 6px; left: 6px; width: 26px; height: 26px; border-radius: 50%; display: flex;
          align-items: center; justify-content: center; background: rgba(10,12,16,.85);
          box-shadow: 0 0 0 1px rgba(229,228,226,.45); }
  .plat svg { width: 16px; height: 16px; }
  .plat + .warn { left: 38px; }
  .warn { position: absolute; top: 6px; left: 6px; background: var(--mid); color: #1a1a1a; border-radius: 6px; padding: 0 7px; font-weight: 700; font-size: 13px; }
  .badge { display: inline-block; background: var(--panel2); border-radius: 5px; padding: 0 5px; margin-right: 4px; }
  .empty { padding: 40px 24px; color: var(--muted); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; width: min(560px, 94vw); padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  form.edit { padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  form.edit input:not([type=checkbox]), form.edit textarea { width: 100%; min-width: 0; }
  .lbl-short { display: none; }
  form.edit label, .set label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  form.edit .full { grid-column: 1 / -1; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .actions .left { margin-right: auto; }
  .igdb { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 12px; }
  /* game dialog: cover on the left, fields and IGDB search on the right; fixed size so nothing jumps */
  #dlg:has(form.two) { width: min(920px, 96vw); height: min(740px, calc(100dvh - 32px)); }
  form.edit.two { height: 100%; grid-template-columns: 220px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto;
                  grid-template-areas: "cover fields" "cover igdb" "actions actions"; column-gap: 22px; }
  form.two .dcover { grid-area: cover; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--muted); }
  form.two .dcover img, form.two .dcover .ph { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px;
                                               background: var(--panel2); display: block; }
  form.two .dcover b { color: var(--text); }
  form.two .dfields { grid-area: fields; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  form.two .igdb { grid-area: igdb; display: flex; flex-direction: column; min-height: 0; }
  form.two .igdb .results { flex: 1; height: auto; min-height: 0; }
  form.two .actions { grid-area: actions; }
  /* fixed size: the dialog must not grow and shrink with every search (results, "Searching…", images loading) */
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-top: 8px;
             height: 300px; overflow-y: auto; align-content: start; overscroll-behavior: contain; }
  .results div { cursor: pointer; font-size: 11px; color: var(--muted); }
  .results div:hover { color: var(--text); }
  .results div.sel { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 5px; color: var(--text); }
  .results img, .results .ph { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 5px; background: var(--panel2); display: block; }
  .tabs { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: 10px 14px; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .syncbar { display: flex; flex-wrap: wrap; gap: 12px; padding: 14px 24px 4px; }
  .src { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 240px; flex: 1; font-size: 13px; }
  .src h3 { margin: 0 0 4px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .src .msg { color: var(--muted); }
  .src .err { color: var(--bad); }
  .src .part { color: var(--mid); }
  .clist { padding: 8px 24px 40px; display: flex; flex-direction: column; gap: 8px; }
  .cand { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .cand img, .cand .ph { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; background: var(--panel2); }
  .cand .t { font-weight: 600; }
  .cand .s { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .cand .sig { font-size: 13px; margin-top: 3px; }
  .cand .sig.none { color: var(--muted); }
  .cand .btns { display: flex; gap: 6px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 8px; display: none; z-index: 20; max-width: 90vw; }

  /* --- sign-in --- */
  .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 12px; }
  .login .brand { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 6px; text-align: center; }
  .login .brand img { width: 72px; height: 72px; }
  .login .brand b { font-size: 22px; }
  .login .brand span { color: var(--muted); font-size: 13px; }
  .login label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .login .err { color: var(--bad); font-size: 13px; min-height: 1em; }

  /* --- settings --- */
  .set { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
  .set h2 { margin: 0; font-size: 18px; }
  .set section { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .set h3 { margin: 0; font-size: 15px; }
  .set .row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .set .row > label { flex: 1; min-width: 150px; }
  .set .hint { color: var(--muted); font-size: 12px; }
  .set .ok { color: var(--good); }
  .set code { background: var(--panel2); border-radius: 4px; padding: 1px 5px; font-size: 12px; word-break: break-all; }
  .filebtn { display: inline-block; cursor: pointer; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font-size: 15px; color: var(--text); }
  .set .row > label.filebtn { flex: 0 0 auto; min-width: 0; }
  .filebtn:hover, .set a button:hover { border-color: var(--accent); }
  #importOut ul { margin: 4px 0 0; padding-left: 18px; }
  .setpage { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 28px; padding: 18px 24px 40px; max-width: 1040px; }
  .setnav { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 12px; align-self: start; }
  .setnav button { text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 12px; color: var(--muted); }
  .setnav button.on { background: var(--panel2); color: var(--text); }
  .setpage .set { padding: 0; }
  .setpage .set section { border-top: 0; padding-top: 0; }
  .setpage .set h3 { margin-top: 10px; }
  .pcards { display: flex; flex-direction: column; gap: 8px; }
  .pcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .pcard summary { display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; list-style: none; }
  .pcard summary::-webkit-details-marker { display: none; }
  .pcard summary::after { content: "›"; color: var(--muted); transition: transform .15s; }
  .pcard[open] summary::after { transform: rotate(90deg); }
  .pcard summary small { color: var(--muted); margin-left: auto; font-size: 12px; }
  .pcard[open] summary { border-bottom: 1px solid var(--line); }
  .pcard > form, .pcard > .pbody { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .ico { width: 18px; height: 18px; fill: currentColor; flex: none; display: inline-block; }
  .badge .ico { width: 12px; height: 12px; vertical-align: -2px; margin-right: 4px; }
  .src h3 .ico { margin-right: 6px; vertical-align: -3px; }
  .src { cursor: pointer; }
  .src.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  button.logout { background: var(--bad); border-color: var(--bad); color: #1a0d0d; font-weight: 600; }
  #btnSettings.on { border-color: var(--accent); color: var(--accent); }
  .users { display: flex; flex-direction: column; gap: 6px; }
  .users div { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .users div span { margin-right: auto; }

  /* --- year in review --- */
  .rv { padding: 14px 24px 50px; display: flex; flex-direction: column; gap: 18px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { padding: 5px 12px; border-radius: 999px; font-size: 14px; }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: #0d1220; font-weight: 600; }
  .rv-hero { background: linear-gradient(135deg, #24345f, #1a1e2a 70%); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; }
  .rv-hero h2 { margin: 0 0 4px; font-size: 26px; }
  .rv-hero p { margin: 0; color: var(--muted); }
  .rv-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .rv-tiles .tile b { font-size: 28px; }
  .rv-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .panel h3 { margin: 0 0 12px; font-size: 15px; }
  .vbars { display: flex; align-items: flex-end; gap: 2px; height: 150px; }
  .vbars div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; }
  .vbars i { display: block; width: 72%; max-width: 30px; background: var(--accent); border-radius: 4px 4px 0 0; }
  .vbars div:hover i { filter: brightness(1.2); }
  .vbars em { font-style: normal; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .vbars small { font-size: 11px; color: var(--muted); margin-top: 4px; white-space: nowrap; border-top: 1px solid var(--line); width: 100%; text-align: center; padding-top: 3px; }
  .hbars { display: flex; flex-direction: column; gap: 6px; }
  .hbars div { display: grid; grid-template-columns: 90px 1fr 34px; gap: 8px; align-items: center; font-size: 13px; }
  .hbars span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbars i { display: block; height: 14px; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 3px; }
  .hbars b { font-weight: 600; text-align: right; }
  .top { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
  .top .card { cursor: pointer; }
  .top .rank { position: absolute; bottom: 6px; left: 6px; background: rgba(10,12,16,.85); border-radius: 6px; padding: 0 7px; font-weight: 700; font-size: 13px; }
  .hl { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .hl .item { display: flex; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; }
  .hl .item img, .hl .item .ph { width: 46px; height: 61px; object-fit: cover; border-radius: 5px; background: var(--panel2); flex: none; }
  .hl .item small { color: var(--muted); display: block; font-size: 12px; }
  .hl .item b { display: block; font-size: 14px; }
  .hl .item span { color: var(--muted); font-size: 12px; }
  .tip { position: fixed; pointer-events: none; background: #0d0f14; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; z-index: 30; max-width: 280px; display: none; }
  .tip b { display: block; }

  /* --- phones --- */
  @media (max-width: 640px) {
    body { font-size: 14px; }
    input, select, textarea { font-size: 16px; }   /* below 16px iOS zooms in on focus */
    header { padding: 12px 14px 6px; gap: 8px; flex-wrap: nowrap; }
    h1 { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    h1 img { width: 26px; height: 26px; }
    header button { padding: 6px 10px; }
    .lbl-long { display: none; }
    .lbl-short { display: inline; }
    .tabs { padding: 0 8px; overflow-x: auto; }
    .tabs button { padding: 10px; white-space: nowrap; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 10px 14px 4px; }
    .tile { min-width: 0; padding: 8px 10px; }
    .tile b { font-size: 20px; }
    .tile span { font-size: 12px; }
    .years { grid-column: 1 / -1; min-width: 0; overflow-x: auto; height: 84px; padding: 8px 10px 0; }
    .years div { flex: 0 0 26px; }
    .filters { padding: 10px 14px; }
    .filters input[type=search] { flex: 1 1 100%; min-width: 0; }
    .filters select { flex: 1 1 40%; min-width: 0; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding: 6px 14px 30px; }
    .meta { padding: 6px 8px 8px; }
    dialog { width: calc(100vw - 16px); max-width: none; max-height: calc(100dvh - 16px); overflow-y: auto; }
    .results { height: 230px; }
    #dlg:has(form.two) { height: auto; }
    form.edit.two { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: none;
                    grid-template-areas: "cover" "fields" "igdb" "actions"; }
    form.two .dcover { flex-direction: row; align-items: center; }
    form.two .dcover img, form.two .dcover .ph { width: 72px; flex: none; }
    form.two .igdb .results { flex: none; height: 230px; }
    form.edit, .set { padding: 14px; gap: 10px; }
    .actions button { padding: 8px 12px; }
    .syncbar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px 14px 0; }
    .src { min-width: 0; padding: 8px; font-size: 12px; }
    .src h3 { flex-direction: column; align-items: stretch; gap: 6px; font-size: 14px; }
    .src h3 button { padding: 5px 6px; font-size: 13px; }
    .src .detail.msg { display: none; }   /* errors and API limits stay visible */
    .clist { padding: 6px 14px 30px; }
    .cand { grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 8px; }
    .cand img, .cand .ph { width: 52px; height: 52px; }
    .cand .btns { grid-column: 1 / -1; justify-content: flex-end; }
    .rv { padding: 12px 14px 40px; gap: 14px; }
    .setpage { grid-template-columns: minmax(0, 1fr); padding: 10px 14px 30px; gap: 12px; }
    .setnav { flex-direction: row; overflow-x: auto; position: static; }
    .setnav button { white-space: nowrap; }
    .pcard summary small { display: none; }
    .pcard summary::after { margin-left: auto; }
    .rv-hero { padding: 16px; }
    .rv-hero h2 { font-size: 21px; }
    .rv-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .rv-row { grid-template-columns: minmax(0, 1fr); }
    .vbars { height: 120px; }
    .vbars small { font-size: 10px; }
    .top { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  }
</style>
</head>
<body>
<!-- platinum gradient for the cup, defined once in an element that is always rendered -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#f4f6f8"/><stop offset=".5" stop-color="#b9c4ce"/><stop offset="1" stop-color="#eef1f4"/></linearGradient></defs></svg>

<!-- sign-in / first start -->
<div class="login" id="loginView" hidden>
  <form id="loginForm">
    <div class="brand"><img src="/static/icon.svg" alt=""><b>Epilogg</b><span data-i18n="tagline"></span></div>
    <div id="setupNote" class="hint" hidden style="color:var(--muted);font-size:13px" data-i18n="setup_note"></div>
    <label><span data-i18n="username"></span><input name="username" autocomplete="username" required maxlength="40"></label>
    <label><span data-i18n="password"></span><input name="password" type="password" autocomplete="current-password" required></label>
    <label id="pw2Lbl" hidden><span data-i18n="password_repeat"></span><input name="password2" type="password" autocomplete="new-password"></label>
    <label><span data-i18n="language"></span><select name="lang" id="loginLang"><option value="en">English</option><option value="it">Italiano</option></select></label>
    <div class="err" id="loginErr"></div>
    <button class="primary" type="submit" id="loginBtn"></button>
  </form>
</div>

<div id="appView" hidden>
<header>
  <h1><img src="/static/icon.svg" alt="">Epilogg</h1>
  <button id="btnCovers" data-i18n-title="covers_title"><span class="lbl-long" data-i18n="covers_btn"></span><span class="lbl-short">🖼</span></button>
  <button class="primary" id="btnAdd" data-i18n-title="add_title">+<span class="lbl-long" data-i18n="add_btn"></span></button>
  <button id="btnSettings" data-i18n-title="settings">⚙</button>
</header>

<nav class="tabs">
  <button id="tabReg" class="on" data-i18n="tab_log"></button>
  <button id="tabNc" data-i18n="tab_notdone"></button>
  <button id="tabCand"><span data-i18n="tab_platforms"></span> <span id="nCand"></span></button>
  <button id="tabRv" data-i18n="tab_review"></button>
</nav>

<div id="regView">
<section class="stats">
  <div class="tile"><b id="stTot">–</b><span data-i18n="completed"></span></div>
  <div class="tile"><b id="stYear">–</b><span id="stYearLbl"></span></div>
  <div class="tile"><b id="stAvg">–</b><span data-i18n="avg_rating"></span></div>
  <div class="tile years" id="years" data-i18n-title="years_title"></div>
</section>

<section class="filters">
  <input type="search" id="q" data-i18n-ph="search">
  <select id="fYear"><option value="" data-i18n="all_years"></option></select>
  <select id="fPlat"><option value="" data-i18n="all_platforms"></option></select>
  <select id="fVoto">
    <option value="" data-i18n="all_ratings"></option>
    <option value="9" data-i18n="r9"></option>
    <option value="8" data-i18n="r8"></option>
    <option value="7" data-i18n="r7"></option>
    <option value="6" data-i18n="r6"></option>

function platIcon(p) {   // platform name in the log -> icon
  const s = (p || '').toLowerCase();
  if (s.includes('steam')) return 'steam';
  if (/^ps|playstation|vita/.test(s)) return 'playstation';
  if (s.includes('epic')) return 'epicgames';
  if (s.includes('gog')) return 'gog';
  if (s.includes('ubisoft') || s.includes('uplay')) return 'ubisoft';
  if (/switch|\bgb[ac]?\b|game ?boy|\bs?nes\b|n64|\b[n3]ds\b|gamecube|wii/.test(s)) return 'handheld';
  if (s === 'pc' || s.includes('windows')) return 'monitor';
  return 'pad';
}

// --- sign-in -----------------------------------------------------------------------
let setupMode = false;
function showLogin(setup) {
  setupMode = setup;
  $('#appView').hidden = true;
  $('#loginView').hidden = false;
  $$('dialog[open]').forEach(d => d.close());
  $('#setupNote').hidden = $('#pw2Lbl').hidden = !setup;
  $('#loginForm').password.autocomplete = setup ? 'new-password' : 'current-password';
  $('#loginLang').value = lang;
  $('#loginBtn').textContent = t(setup ? 'create_admin' : 'login');
  $('#loginErr').textContent = '';
  applyI18n();
  $('#loginBtn').textContent = t(setup ? 'create_admin' : 'login');
}
$('#loginLang').addEventListener('input', e => { lang = e.target.value; localStorage.setItem('epilogg_lang', lang); showLogin(setupMode); });
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  $('#loginErr').textContent = '';
  try {
    if (setupMode) {
      if (f.password.value.length < 8) throw new Error(t('pw_short'));
      if (f.password.value !== f.password2.value) throw new Error(t('pw_mismatch'));
      await api('/api/auth/setup', {method: 'POST', body: JSON.stringify({username: f.username.value, password: f.password.value, lang})});
    } else {
      await api('/api/auth/login', {method: 'POST', body: JSON.stringify({username: f.username.value, password: f.password.value})});
    }
    f.reset();
    await boot();
  } catch (err) { $('#loginErr').textContent = err.message; }
});

async function boot() {
  const st = await api('/api/auth/state');
  if (!st.user) return showLogin(st.setup);
  me = st.user;
  lang = me.lang;
  localStorage.setItem('epilogg_lang', lang);
  $('#loginView').hidden = true;
  $('#appView').hidden = false;
  applyI18n();
  await load();
  const s = await api('/api/sync');
  const n = Object.values(s).reduce((a, v) => a + (v.strong || 0), 0);
  $('#nCand').textContent = n ? `(${n})` : '';
  if (location.hash.startsWith('#settings')) openSettings(location.hash.split('/')[1]);   // reload on a settings page
}

// --- log -------------------------------------------------------------------------
async function load() {
  [games, cfg] = await Promise.all([api('/api/games'), api('/api/config')]);
  me = cfg.user;
  $('#btnCovers').hidden = !cfg.igdb || tab !== 'reg';
  const years = [...new Set(games.map(year).filter(Boolean))].sort().reverse();
  const plats = [...new Set(games.map(g => g.platform))].sort();
  const keep = (sel, vals) => { const v = sel.value; sel.length = 1; vals.forEach(x => sel.add(new Option(x, x))); sel.value = vals.includes(v) ? v : ''; };
  keep($('#fYear'), years);
  keep($('#fPlat'), plats);
  $('#platList').innerHTML = plats.map(p => `<option value="${esc(p)}">`).join('');
  render();
  if (tab === 'rv') renderReview();
}

function render() {
  const q = $('#q').value.trim().toLowerCase(), fy = $('#fYear').value, fp = $('#fPlat').value, fc = $('#fCheck').checked;
  const fv = $('#fVoto').value;
  const votoOk = g => !fv || (fv === 'none' ? g.rating == null : fv === 'low' ? g.rating != null && g.rating < 6 : g.rating != null && g.rating >= Number(fv));
  $('#nCheck').textContent = `(${games.filter(doubtful).length})`;
  let list = games.filter(g => (!fy || year(g) === fy) && (!fp || g.platform === fp) && (!fc || doubtful(g)) && votoOk(g)
    && (!q || g.title.toLowerCase().includes(q) || (g.igdb_name || '').toLowerCase().includes(q)));
  const s = $('#sort').value;
  if (s === 'rating') list.sort((a, b) => (b.rating ?? -1) - (a.rating ?? -1));
  else if (s === 'hours') list.sort((a, b) => (b.hours ?? -1) - (a.hours ?? -1));
  else if (s === 'title') list.sort((a, b) => (a.igdb_name || a.title).localeCompare(b.igdb_name || b.title));

  // summary: total and average follow the platform/search filters, the year chart does not
  const thisYear = String(new Date().getFullYear());
  $('#stTot').textContent = list.length;
  $('#stYear').textContent = games.filter(g => year(g) === thisYear).length;
  $('#stYearLbl').textContent = t('in_year', {y: thisYear});
  $('#stAvg').textContent = avg(list);
  const counts = {};
  games.forEach(g => { const y = year(g); if (y) counts[y] = (counts[y] || 0) + 1; });
  const ys = Object.keys(counts).sort(), max = Math.max(1, ...Object.values(counts));
  $('#years').innerHTML = ys.map(y => `<div data-y="${y}" class="${y === fy ? 'sel' : ''}" title="${y}: ${counts[y]}">
      <em>${counts[y]}</em><i style="height:${Math.max(4, counts[y] / max * 56)}px"></i><small>'${y.slice(2)}</small></div>`).join('');
  $('#years').scrollLeft = $('#years').scrollWidth;

  $('#grid').innerHTML = list.map(g => cardHtml(g)).join('');
  $('#empty').hidden = list.length > 0;
}
function cardHtml(g, extra = '') {
  const name = g.igdb_name || g.title;
  const bg = g.cover ? `style="background-image:url('${coverUrl(g)}')"` : '';
  return `<div class="card" data-id="${g.id}">
    <div class="cover" ${bg}>${g.cover ? '' : esc(name)}
      ${full(g) ? `<span class="plat" title="${esc(t('all_ach', {d: g.ach_done, t: g.ach_total}))}">${PLAT_SVG}</span>` : ''}
      ${!extra && doubtful(g) ? `<span class="warn" title="${esc(t('check_badge'))}">?</span>` : ''}
      ${g.rating != null ? `<span class="score" style="color:${scoreColor(g.rating)}">${g.rating}</span>` : ''}${extra}</div>
    <div class="meta"><div class="t" title="${esc(name)}">${esc(name)}</div>
      <div class="s"><span class="badge">${ico(platIcon(g.platform))}${esc(g.platform)}</span>${fmtDate(g.completed_on)}</div>
      ${playLine(g) ? `<div class="s">${playLine(g)}</div>` : ''}</div>
  </div>`;
}

function openDialog(g) {
  editing = g;
  const f = $('#form');
  f.reset();
  f.elements.title.value = g?.title ?? '';
  f.platform.value = g?.platform ?? '';
  f.completed_on.value = g?.completed_on ?? new Date().toISOString().slice(0, 10);
  f.rating.value = decStr(g?.rating);
  f.hours.value = decStr(g?.manual_hours);
  f.hours.placeholder = g?.plat_hours != null ? `${g.plat_hours}` : '';
  $('#platInfo').textContent = g?.plat_source
    ? t('from_plat', {s: SRC[g.plat_source] || g.plat_source, h: g.plat_hours != null ? fmtHours(g.plat_hours) : t('no_hours')})
      + (g.ach_total ? ' · ' + t('ach_n', {d: g.ach_done, t: g.ach_total}) : '') + (g.manual_hours != null ? t('manual_wins') : '')
    : '';
  f.notes.value = g?.notes ?? '';
  $('#btnDel').hidden = !g;

         ${g.match_manual ? t('manual_pick') : doubtful(g) ? t('to_check') : t('automatic')}</span>`

}

// decimals: "8,5" and "8.5" are the same; shown with the language's separator
const decNum = v => v.trim() === '' ? null : Number(v.trim().replace(',', '.'));
const decStr = v => v == null ? '' : lang === 'it' ? String(v).replace('.', ',') : String(v);

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  const rating = decNum(f.rating.value), hours = decNum(f.hours.value);
  if (rating != null && !(rating >= 0 && rating <= 10)) { toast(t('bad_rating'), 4000); f.rating.focus(); return; }
  if (hours != null && !(hours >= 0)) { toast(t('bad_hours'), 4000); f.hours.focus(); return; }
  const body = {
    title: f.elements.title.value, platform: f.platform.value,
    completed_on: f.completed_on.value || null, rating, hours,
    notes: f.notes.value || null,
    igdb_id: !editing && pick ? pick.id : null,   // new game: the cover picked in the dialog
  };
  try {
    if (confirming) {
      const id = confirming.id;
      await api(`/api/candidates/${id}/confirm`, {method: 'POST', body: JSON.stringify(body)});
      $('#dlg').close();
      cands = cands.filter(x => x.id !== id);
      ncs = ncs.filter(x => x.id !== id);
      renderCands(); renderNc();
      loadSync();
      toast(t('added_log'));
      await load();
      setTimeout(load, 2500);   // the cover arrives from IGDB in the background
      return;
    }
    if (editing) await api(`/api/games/${editing.id}`, {method: 'PUT', body: JSON.stringify(body)});
    else { await api('/api/games', {method: 'POST', body: JSON.stringify(body)}); setTimeout(load, 2500); }
    $('#dlg').close();
    await load();
  } catch (err) { toast(t('error') + err.message, 5000); }
});

$('#btnDel').onclick = async () => {

};

async function igdbSearch() {

// --- year in review --------------------------------------------------------------
let rvYear = null;   // null = the latest year with games; 'all' = all time
function renderReview() {
  const years = [...new Set(games.map(year).filter(Boolean))].sort().reverse();
  if (rvYear === null) rvYear = years.includes(String(new Date().getFullYear())) ? String(new Date().getFullYear()) : (years[0] || 'all');
  const all = rvYear === 'all';
  const list = games.filter(g => all || year(g) === rvYear);
  const chips = `<div class="chips">${years.map(y => `<button data-rv="${y}" class="${y === rvYear ? 'on' : ''}">${y}</button>`).join('')}
    <button data-rv="all" class="${all ? 'on' : ''}">${t('rv_all')}</button></div>`;
  if (!list.length) { $('#rv').innerHTML = chips + `<div class="empty">${t('rv_none')}</div>`; return; }

  const withH = list.filter(g => g.hours != null);
  const hours = Math.round(withH.reduce((a, g) => a + g.hours, 0));
  const plat = list.filter(full).length;
  const nf = n => n.toLocaleString(t('locale'));

  // per month (one year) or per year (all time)
  let buckets;
  if (all) {
    const ys = years.slice().reverse();
    buckets = ys.map(y => ({label: `'${y.slice(2)}`, full: y, games: list.filter(g => year(g) === y)}));
  } else {
    buckets = I18N[lang].months.map((m, i) => ({label: m, full: m, games: list.filter(g => g.completed_on && Number(g.completed_on.slice(5, 7)) === i + 1)}));
  }
  const bmax = Math.max(1, ...buckets.map(b => b.games.length));
  const best = buckets.reduce((a, b) => b.games.length > a.games.length ? b : a, buckets[0]);
  const tipList = gs => gs.slice(0, 8).map(g => esc(g.igdb_name || g.title)).join('<br>') + (gs.length > 8 ? '<br>' + t('and_more', {n: gs.length - 8}) : '');
  const vbars = `<div class="vbars">${buckets.map(b => `<div data-tip="<b>${esc(b.full)} · ${t('bar_tip', {n: b.games.length})}</b>${tipList(b.games)}">
      <em>${b.games.length || ''}</em><i style="height:${b.games.length ? Math.max(4, b.games.length / bmax * 110) : 0}px"></i><small>${esc(b.label)}</small></div>`).join('')}</div>`;

  const byPlat = Object.entries(list.reduce((a, g) => (a[g.platform] = (a[g.platform] || []).concat(g), a), {}))
    .sort((a, b) => b[1].length - a[1].length);
  const pmax = byPlat[0][1].length;
  const shownPlat = byPlat.slice(0, 7), restPlat = byPlat.slice(7).flatMap(x => x[1]);
  if (restPlat.length) shownPlat.push([lang === 'it' ? 'Altre' : 'Other', restPlat]);
  const hbarsPlat = `<div class="hbars">${shownPlat.map(([p, gs]) => `<div data-tip="<b>${esc(p)} · ${t('bar_tip', {n: gs.length})}</b>${tipList(gs)}">
      <span>${esc(p)}</span><i style="width:${gs.length / pmax * 100}%"></i><b>${gs.length}</b></div>`).join('')}</div>`;

  const rated = list.filter(g => g.rating != null);
  const rb = [10, 9, 8, 7, 6].map(v => ({label: v === 10 ? '10' : `${v}–${v + .5}`, games: rated.filter(g => v === 10 ? g.rating === 10 : g.rating >= v && g.rating < v + 1)}));
  const low = rated.filter(g => g.rating < 6);
  if (low.length) rb.push({label: '< 6', games: low});
  const rmax = Math.max(1, ...rb.map(b => b.games.length));
  const hbarsRate = `<div class="hbars">${rb.map(b => `<div data-tip="<b>${b.label} · ${t('bar_tip', {n: b.games.length})}</b>${tipList(b.games)}">
      <span>${b.label}</span><i style="width:${b.games.length / rmax * 100}%"></i><b>${b.games.length}</b></div>`).join('')}</div>`;

  const top = rated.slice().sort((a, b) => b.rating - a.rating || (b.hours ?? 0) - (a.hours ?? 0)).slice(0, all ? 10 : 5);
  const byDate = list.filter(g => g.completed_on).sort((a, b) => a.completed_on.localeCompare(b.completed_on));
  const byHours = withH.slice().sort((a, b) => b.hours - a.hours);
  const byRel = list.filter(g => g.release_year).sort((a, b) => a.release_year - b.release_year);
  const hl = [
    [t('hl_longest'), byHours[0], g => fmtHours(g.hours)],
    [t('hl_shortest'), byHours.length > 1 ? byHours[byHours.length - 1] : null, g => fmtHours(g.hours)],
    [t('hl_first'), all ? null : byDate[0], g => fmtDate(g.completed_on)],
    [t('hl_last'), all ? null : byDate[byDate.length - 1], g => fmtDate(g.completed_on)],
    [t('hl_oldest'), byRel[0], g => t('released', {y: g.release_year})],
    [t('hl_newest'), byRel.length > 1 ? byRel[byRel.length - 1] : null, g => t('released', {y: g.release_year})],
  ].filter(x => x[1]);

  $('#rv').innerHTML = chips + `
    <div class="rv-hero"><h2>${all ? t('rv_title_all') : t('rv_title_year', {y: rvYear})}</h2>
      <p>${t('rv_sub', {n: list.length, h: nf(hours)})}${withH.length < list.length ? ` · <small>${t('hours_on', {n: withH.length, t: list.length})}</small>` : ''}</p></div>
    <div class="rv-tiles">
      <div class="tile"><b>${list.length}</b><span>${t('rv_games')}</span></div>
      <div class="tile"><b>${nf(hours)}</b><span>${t('rv_hours')}</span></div>
      <div class="tile"><b>${avg(list)}</b><span>${t('rv_avg')}</span></div>
      <div class="tile"><b>${plat}</b><span>${t('rv_plat')}</span></div>
      <div class="tile"><b>${best.games.length ? esc(best.full) : '–'}</b><span>${t(all ? 'rv_best_year' : 'rv_best_month')}${best.games.length ? ` · ${best.games.length}` : ''}</span></div>
    </div>
    <div class="panel"><h3>${t(all ? 'rv_year_chart' : 'rv_month_chart')}</h3>${vbars}</div>
    ${top.length ? `<div><h3 style="margin:0 0 10px;font-size:15px">${t('rv_top')}</h3><div class="top">${top.map((g, i) => cardHtml(g, `<span class="rank">#${i + 1}</span>`)).join('')}</div></div>` : ''}
    <div class="rv-row">
      <div class="panel"><h3>${t('rv_platforms')}</h3>${hbarsPlat}</div>
      ${rated.length ? `<div class="panel"><h3>${t('rv_ratings')}</h3>${hbarsRate}</div>` : ''}
    </div>
    ${hl.length ? `<div><h3 style="margin:0 0 10px;font-size:15px">${t('rv_highlights')}</h3><div class="hl">${hl.map(([lbl, g, f]) => `
      <div class="item" data-id="${g.id}">${g.cover ? `<img src="${coverUrl(g)}" alt="">` : '<span class="ph"></span>'}
        <div><small>${lbl}</small><b>${esc(g.igdb_name || g.title)}</b><span>${f(g)} · ${esc(g.platform)}</span></div></div>`).join('')}</div></div>` : ''}`;
}

// --- from platforms -----------------------------------------------------------
const STRONG = new Set(['story', 'platinum', '100']);
let cands = [], confirming = null, syncTimer = null;

async function loadSync() {
  const st = await api('/api/sync');
  let running = false, newCount = 0;
  $('#syncbar').innerHTML = Object.entries(st).map(([k, v]) => {
    running ||= v.status === 'running';
    newCount += v.strong || 0;
    const cls = v.status === 'error' ? 'err' : v.status === 'partial' ? 'part' : 'msg';
    const when = v.last_ok ? t('last_ok', {w: new Date(v.last_ok).toLocaleString(t('locale'), {dateStyle: 'short', timeStyle: 'short'})}) : t('never');
    const m = v.status === 'running' ? I18N[lang].sync.running : tSync(v.message);
    return `<div class="src ${$('#cSrc').value === k ? 'sel' : ''}" data-src="${k}" title="${esc(t('src_filter'))}"><h3><span>${ico(SRC_ICON[k])}${SRC[k]}</span>
        ${v.configured ? `<button data-sync="${k}" ${v.status === 'running' ? 'disabled' : ''}>${v.status === 'running' ? t('sync_running') : t('sync_btn')}</button>` : ''}</h3>
      ${v.configured
        ? `<div class="detail ${cls}">${esc(m)}</div><div class="msg">${when}${v.total ? t('games_new', {t: v.total, n: v.new || 0}) : ''}</div>`
        : `<div class="msg">${t('not_set')}</div>`}</div>`;
  }).join('');
  $('#nCand').textContent = newCount ? `(${newCount})` : '';
  clearTimeout(syncTimer);
  if (running) syncTimer = setTimeout(() => { loadSync(); loadCands(); }, 5000);
}
$('#syncbar').addEventListener('click', async e => {
  if (e.target.closest('[data-goset]')) { e.preventDefault(); return openSettings('platforms'); }
  const card = e.target.closest('.src');
  if (card && !e.target.closest('button')) {   // click on a platform: filter the list on it (again: all)
    $('#cSrc').value = $('#cSrc').value === card.dataset.src ? '' : card.dataset.src;
    // a platform with only weak hints (Nintendo, Ubisoft, last achievement) would show nothing under "strong"
    if ($('#cSig').value === 'strong' && $('#cSrc').value && !cands.some(c => c.source === $('#cSrc').value && STRONG.has(c.signal)))
      $('#cSig').value = 'any';
    renderCands(); markSrc();
    return;
  }
  const b = e.target.closest('[data-sync]');
  if (!b) return;
  try { await api(`/api/sync/${b.dataset.sync}`, {method: 'POST'}); setTimeout(loadSync, 500); }
  catch (err) { toast(t('error') + err.message, 5000); }
});

async function loadCands() {
  cands = await api('/api/candidates?status=' + $('#cStatus').value);
  renderCands();
}
function renderCands() {
  const q = $('#cq').value.trim().toLowerCase(), src = $('#cSrc').value, sig = $('#cSig').value;
  const list = cands.filter(c => (!src || c.source === src) && (!q || c.title.toLowerCase().includes(q))
    && (sig === '' || (sig === 'any' ? c.signal : STRONG.has(c.signal))));
  $('#clist').innerHTML = list.map(c => candRow(c, $('#cStatus').value)).join('');
  $('#cempty').hidden = list.length > 0;
}
let ncs = [];   // not completed (dismissed candidates)
async function loadNc() {
  ncs = await api('/api/candidates?status=dismissed');
  renderNc();
}
function renderNc() {
  const q = $('#nq').value.trim().toLowerCase(), src = $('#nSrc').value;
  const list = ncs.filter(c => (!src || c.source === src) && (!q || c.title.toLowerCase().includes(q)));
  $('#nclist').innerHTML = list.map(c => candRow(c, 'dismissed')).join('');
  $('#ncempty').hidden = list.length > 0;
}
['#nq', '#nSrc'].forEach(s => $(s).addEventListener('input', renderNc));
function candRow(c, st) {
    const ach = c.ach_total ? t('ach_n', {d: c.ach_done, t: c.ach_total}) : ['nintendo', 'ubisoft'].includes(c.source) ? '' : t('no_ach');   // no achievements from these sources
    const label = c.signal === '100' || !c.signal_label ? '' : `: <i>${esc(c.signal_label)}</i>`;
    const sigTxt = c.signal === 'last' ? `${t('sig_last')}${label} · ${fmtDate(c.signal_date)} <span style="color:var(--muted)">${t('weak')}</span>`
      : c.signal ? `${t('sig_' + c.signal)}${label} · ${fmtDate(c.signal_date)}` : t('no_signal');
    const btns = st === 'new' ? `<button class="primary" data-ok="${c.id}">${t('btn_done')}</button><button data-dis="${c.id}">${t('btn_notdone')}</button>`
      : st === 'dismissed' ? `<button class="primary" data-ok="${c.id}">${t('btn_done')}</button><button data-res="${c.id}">${t('btn_restore')}</button>` : '';
    return `<div class="cand">
      ${c.image_url ? `<img loading="lazy" src="${esc(c.image_url)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph'}))">` : '<span class="ph"></span>'}
      <div><div class="t">${esc(c.title)}</div>
        <div class="s"><span class="badge">${ico(platIcon(c.platform))}${esc(c.platform)}</span>${[c.hours != null ? `${c.hours} h` : '', ach].filter(Boolean).join(' · ')}${c.last_played ? t('last_played', {d: fmtDate(c.last_played)}) : ''}</div>
        <div class="sig ${c.signal ? '' : 'none'}">${sigTxt}</div></div>
      <div class="btns">${btns}</div></div>`;
}
['#cq', '#cSrc', '#cSig'].forEach(s => $(s).addEventListener('input', renderCands));
const markSrc = () => $$('#syncbar .src').forEach(c => c.classList.toggle('sel', c.dataset.src === $('#cSrc').value));
$('#cSrc').addEventListener('input', markSrc);
$('#cStatus').addEventListener('input', loadCands);
document.addEventListener('click', async e => {   // candidate buttons, in Platforms and Not completed
  const b = e.target.closest('.clist button');
  if (!b) return;
  if (b.dataset.ok) {
    const c = [...cands, ...ncs].find(x => x.id === Number(b.dataset.ok));
    confirming = c;
    openDialog(null);
    const f = $('#form');
    f.elements.title.value = c.title;
    f.platform.value = c.platform;
    f.completed_on.value = c.signal_date || c.last_played || '';
    f.notes.value = '';
    f.hours.placeholder = c.hours != null ? `${c.hours}` : '';
    $('#platInfo').textContent = (c.hours != null ? t('from_plat', {s: SRC[c.source], h: fmtHours(c.hours)}) : '')
      + (c.ach_total ? ' · ' + t('ach_n', {d: c.ach_done, t: c.ach_total}) : '');
    titleSearch();
    f.rating.focus();
    return;
  }
  const id = b.dataset.dis || b.dataset.res;
  await api(`/api/candidates/${id}/${b.dataset.dis ? 'dismiss' : 'restore'}`, {method: 'POST'});
  cands = cands.filter(x => x.id !== Number(id));
  ncs = ncs.filter(x => x.id !== Number(id));
  renderCands(); renderNc();
  loadSync();
});
$('#dlg').addEventListener('close', () => { confirming = null; });

// --- settings -----------------------------------------------------------------
async function openSettings(sec = 'general') {
  $('#setLang').value = lang;
  $('#setWho').textContent = t('signed_as', {u: me.username, a: me.is_admin ? t('admin_tag') : ''});
  $('#tokenOut').hidden = true;
  $('#importOut').hidden = true;
  $('#btnToken').textContent = t(me.has_token ? 'token_regen' : 'token_new');
  $('#btnTokenDel').hidden = !me.has_token;
  $$('form.credForm').forEach(f => f.reset());
  credState = await api('/api/me/credentials');
  showCredState();
  $('#navUsers').hidden = !me.is_admin;
  if (me.is_admin) await loadUsers();
  showTab('set');
  setSection(sec);
}
function setSection(sec) {
  if (!['general', 'platforms', 'data', 'api', 'users'].includes(sec) || (sec === 'users' && !me.is_admin)) sec = 'general';
  $$('#setNav [data-sec]').forEach(b => b.classList.toggle('on', b.dataset.sec === sec));
  $$('#setView section[data-sec]').forEach(x => x.hidden = x.dataset.sec !== sec);
  history.replaceState(null, '', '#settings/' + sec);   // a settings page can be bookmarked / reloaded
}
$('#setNav').addEventListener('click', e => { const b = e.target.closest('[data-sec]'); if (b) setSection(b.dataset.sec); });
let credState = {};
const showCredState = () => {
  $$('.cst').forEach(e => { e.textContent = credState[e.dataset.k] ? t(e.dataset.k.endsWith('_token') ? 'is_linked' : 'is_set') : ''; e.className = 'cst ok'; });
  $$('.link').forEach(b => { const on = credState[b.dataset.src + '_token']; b.querySelector('[data-unlink]').hidden = !on; });
};
document.addEventListener('click', async e => {   // GOG / Epic: sign in, paste, link, unlink
  const box = e.target.closest('.link');
  if (!box) return;
  const src = box.dataset.src;
  try {
    if (e.target.closest('[data-signin]')) {
      const w = window.open('', '_blank');   // opened right away: after an await browsers would block it
      const {url} = await api(`/api/link/${src}`);
      w.location = url;
    } else if (e.target.closest('[data-linkbtn]')) {
      const code = box.querySelector('[data-code]').value.trim();
      if (!code) return;
      credState = await api(`/api/link/${src}`, {method: 'POST', body: JSON.stringify({code})});
      box.querySelector('[data-code]').value = '';
      showCredState(); toast(t('linked_ok'));
    } else if (e.target.closest('[data-unlink]')) {
      credState = await api(`/api/link/${src}`, {method: 'DELETE'});
      showCredState(); toast(t('unlinked'));
    }
  } catch (err) { toast(t('error') + err.message, 6000); }
});
async function loadUsers() {
  const us = await api('/api/users');
  $('#usersList').innerHTML = us.map(u => `<div><span><b>${esc(u.username)}</b>${u.is_admin ? ' · admin' : ''} · ${t('games_n', {n: u.games})}${u.id === me.id ? ` (${t('you')})` : ''}</span>
    <button type="button" data-reset="${u.id}" data-name="${esc(u.username)}">${t('reset_pw')}</button>
    ${u.id === me.id ? '' : `<button type="button" class="danger" data-deluser="${u.id}" data-name="${esc(u.username)}" data-n="${u.games}">${t('del_user')}</button>`}</div>`).join('');
}
$('#btnSettings').onclick = () => openSettings().catch(err => toast(t('error') + err.message, 5000));
$('#setLang').addEventListener('input', async e => {
  lang = e.target.value;
  localStorage.setItem('epilogg_lang', lang);
  await api('/api/me', {method: 'PUT', body: JSON.stringify({lang})});
  me.lang = lang;
  applyI18n();
  render();
  if (tab === 'rv') renderReview();
  if (tab === 'cand') { loadSync(); renderCands(); }
  $('#setWho').textContent = t('signed_as', {u: me.username, a: me.is_admin ? t('admin_tag') : ''});
  $('#btnToken').textContent = t(me.has_token ? 'token_regen' : 'token_new');
  showCredState();
  if (me.is_admin) loadUsers();
});
$('#btnLogout').onclick = async () => { await api('/api/auth/logout', {method: 'POST'}); showLogin(false); };
$('#pwForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  try {
    await api('/api/me/password', {method: 'POST', body: JSON.stringify({old: f.old.value, new: f.new.value})});
    f.reset(); toast(t('pw_changed'), 5000);
  } catch (err) { toast(t('error') + err.message, 5000); }
});
document.addEventListener('submit', async e => {   // the key-based platforms (Steam, Xbox, PSN, RetroAchievements)
  const f = e.target.closest('form.credForm');
  if (!f) return;
  e.preventDefault();
  const body = {};
  // empty = unchanged; a single space = delete
  [...f.elements].filter(x => x.name).forEach(x => { if (x.value !== '') body[x.name] = x.value.trim(); });
  if (!Object.keys(body).length) return;
  try {
    credState = await api('/api/me/credentials', {method: 'PUT', body: JSON.stringify(body)});
    f.reset();
    showCredState();
    toast(t('creds_saved'));
    const src = f.closest('.pcard').dataset.src;
    const st = await api('/api/sync');
    if (st[src]?.configured) await api(`/api/sync/${src}`, {method: 'POST'}).catch(() => {});
  } catch (err) { toast(t('error') + err.message, 5000); }
});
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const out = $('#importOut');
  out.hidden = false;
  if (file.size > 4e6) { out.textContent = t('file_too_big'); return; }
  out.textContent = t('importing');
  try {
    const r = await api('/api/import', {method: 'POST', body: JSON.stringify({csv: await file.text()})});
    out.innerHTML = esc(t('import_done', {a: r.added, s: r.skipped}))
      + (r.error_count ? `<br>${esc(t('import_errs', {n: r.error_count}))}<ul>${r.errors.map(x =>
          `<li>${esc(t('import_row', {r: x.row, e: tErr(x.error)}))}</li>`).join('')}</ul>` : '');
    await load();
    if (r.added) [5000, 20000, 60000].forEach(ms => setTimeout(load, ms));   // covers arrive from IGDB
  } catch (err) { out.textContent = t('error') + err.message; }
});
$('#btnToken').onclick = async () => {
  const {token} = await api('/api/me/token', {method: 'POST'});
  me.has_token = true;
  $('#tokenOut').innerHTML = `${t('token_once')}<br><code>${esc(token)}</code>`;
  $('#tokenOut').hidden = false;
  $('#btnToken').textContent = t('token_regen');
  $('#btnTokenDel').hidden = false;
};
$('#btnTokenDel').onclick = async () => {
  await api('/api/me/token', {method: 'DELETE'});
  me.has_token = false;
  $('#tokenOut').hidden = true; $('#btnTokenDel').hidden = true;
  $('#btnToken').textContent = t('token_new');
  toast(t('token_revoked'));
};
$('#userForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  try {
    await api('/api/users', {method: 'POST', body: JSON.stringify({username: f.username.value, password: f.password.value, is_admin: f.is_admin.checked, lang})});
    f.reset(); toast(t('user_added')); loadUsers();
  } catch (err) { toast(t('error') + err.message, 5000); }
});
$('#usersList').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  try {
    if (b.dataset.reset) {
      const pw = prompt(t('reset_prompt', {u: b.dataset.name}));
      if (!pw) return;
      if (pw.length < 8) return toast(t('pw_short'));
      await api(`/api/users/${b.dataset.reset}/password`, {method: 'POST', body: JSON.stringify({password: pw})});
      toast('✓');
      if (Number(b.dataset.reset) === me.id) showLogin(false);
    } else if (b.dataset.deluser) {
      if (!confirm(t('del_user_confirm', {u: b.dataset.name, n: b.dataset.n}))) return;
      await api(`/api/users/${b.dataset.deluser}`, {method: 'DELETE'});
      loadUsers();
    }
  } catch (err) { toast(t('error') + err.message, 5000); }
});

boot().catch(err => toast(t('load_err') + err.message, 8000));
</script>
</body>
</html>
