<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giochi completati</title>
<style>
  :root {
    --bg: #14161b; --panel: #1d2027; --panel2: #262a33; --line: #323743;
    --text: #e6e8ec; --muted: #9aa1ad; --accent: #7aa2ff; --good: #5fcf8a; --mid: #e6c35c; --bad: #e57373;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 20px 24px 8px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  h1 { font-size: 22px; margin: 0 auto 0 0; }
  button, select, input, textarea {
    font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 11px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0d1220; font-weight: 600; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; padding: 8px 24px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; min-width: 130px; }
  .tile b { display: block; font-size: 24px; }
  .tile span { color: var(--muted); font-size: 13px; }
  .years { display: flex; align-items: flex-end; gap: 6px; height: 90px; padding: 10px 16px 0; flex: 1; min-width: 260px; }
  .years div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; }
  .years i { display: block; width: 100%; max-width: 34px; background: var(--accent); border-radius: 4px 4px 0 0; opacity: .75; }
  .years div.sel i, .years div:hover i { opacity: 1; }
  .years small { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .years em { font-style: normal; font-size: 11px; color: var(--muted); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 24px; }
  .filters input[type=search] { flex: 1; min-width: 200px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; padding: 8px 24px 40px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
  .card:hover { border-color: var(--accent); }
  .cover { aspect-ratio: 3/4; background: var(--panel2) center/cover no-repeat; position: relative; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; text-align: center; padding: 8px; }
  .score { position: absolute; top: 6px; right: 6px; background: rgba(10,12,16,.85); border-radius: 6px; padding: 2px 7px; font-weight: 700; font-size: 14px; }
  .meta { padding: 8px 10px 10px; }
  .meta .t { font-weight: 600; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta .s { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .plat { position: absolute; top: 6px; left: 6px; width: 26px; height: 26px; border-radius: 50%; display: flex;
          align-items: center; justify-content: center; background: rgba(10,12,16,.85);
          box-shadow: 0 0 0 1px rgba(229,228,226,.45); }
  .plat svg { width: 16px; height: 16px; }
  .plat + .warn { left: 38px; }
  .warn { position: absolute; top: 6px; left: 6px; background: var(--mid); color: #1a1a1a; border-radius: 6px; padding: 0 7px; font-weight: 700; font-size: 13px; }
  .badge { display: inline-block; background: var(--panel2); border-radius: 5px; padding: 0 5px; margin-right: 4px; }
  .empty { padding: 40px 24px; color: var(--muted); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; width: min(560px, 94vw); padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  form.edit { padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  form.edit input:not([type=checkbox]), form.edit textarea { width: 100%; min-width: 0; }
  .lbl-short { display: none; }
  form.edit label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  form.edit .full { grid-column: 1 / -1; }
  form.edit label.check { flex-direction: row; align-items: center; gap: 8px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .actions .left { margin-right: auto; }
  .igdb { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 12px; }
  .igdb .cur { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .igdb .cur img { width: 46px; border-radius: 4px; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-top: 8px; max-height: 320px; overflow: auto; }
  .results div { cursor: pointer; font-size: 11px; color: var(--muted); }
  .results div:hover { color: var(--text); }
  .results img, .results .ph { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 5px; background: var(--panel2); display: block; }
  .tabs { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: 10px 14px; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .syncbar { display: flex; flex-wrap: wrap; gap: 12px; padding: 14px 24px 4px; }
  .src { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 240px; flex: 1; font-size: 13px; }
  .src h3 { margin: 0 0 4px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .src .msg { color: var(--muted); }
  .src .err { color: var(--bad); }
  .src .part { color: var(--mid); }
  .clist { padding: 8px 24px 40px; display: flex; flex-direction: column; gap: 8px; }
  .cand { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .cand img, .cand .ph { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; background: var(--panel2); }
  .cand .t { font-weight: 600; }
  .cand .s { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .cand .sig { font-size: 13px; margin-top: 3px; }
  .cand .sig.none { color: var(--muted); }
  .cand .btns { display: flex; gap: 6px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 8px; display: none; }

  /* --- telefono --- */
  @media (max-width: 640px) {
    body { font-size: 14px; }
    input, select, textarea { font-size: 16px; }   /* sotto i 16px iOS zooma al tocco */
    header { padding: 12px 14px 6px; gap: 8px; flex-wrap: nowrap; }
    h1 { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header button { padding: 6px 10px; }
    .lbl-long { display: none; }
    .lbl-short { display: inline; }
    .tabs { padding: 0 8px; }
    .tabs button { padding: 10px; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 10px 14px 4px; }
    .tile { min-width: 0; padding: 8px 10px; }
    .tile b { font-size: 20px; }
    .tile span { font-size: 12px; }
    .years { grid-column: 1 / -1; min-width: 0; overflow-x: auto; height: 84px; padding: 8px 10px 0; }
    .years div { flex: 0 0 26px; }
    .filters { padding: 10px 14px; }
    .filters input[type=search] { flex: 1 1 100%; min-width: 0; }
    .filters select { flex: 1 1 40%; min-width: 0; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding: 6px 14px 30px; }
    .meta { padding: 6px 8px 8px; }
    dialog { width: calc(100vw - 16px); max-width: none; max-height: calc(100dvh - 16px); overflow-y: auto; }
    form.edit { padding: 14px; gap: 10px; }
    .actions button { padding: 8px 12px; }
    .syncbar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px 14px 0; }
    .src { min-width: 0; padding: 8px; font-size: 12px; }
    .src h3 { flex-direction: column; align-items: stretch; gap: 6px; font-size: 14px; }
    .src h3 button { padding: 5px 6px; font-size: 13px; }
    .src .detail.msg { display: none; }   /* errori e limiti API restano visibili */
    .clist { padding: 6px 14px 30px; }
    .cand { grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 8px; }
    .cand img, .cand .ph { width: 52px; height: 52px; }
    .cand .btns { grid-column: 1 / -1; justify-content: flex-end; }
  }
</style>
</head>
<body>
<header>
  <h1>🎮 Giochi completati</h1>
  <button id="btnCovers" title="Abbina a IGDB i giochi senza copertina"><span class="lbl-long">Copertine mancanti</span><span class="lbl-short">🖼</span></button>
  <a href="/api/export.csv" title="Esporta CSV"><button><span class="lbl-long">Esporta CSV</span><span class="lbl-short">CSV</span></button></a>
  <button class="primary" id="btnAdd" title="Aggiungi un gioco">+<span class="lbl-long"> Aggiungi</span></button>
</header>

<nav class="tabs">
  <button id="tabReg" class="on">Registro</button>
  <button id="tabCand">Dalle piattaforme <span id="nCand"></span></button>
</nav>

<div id="regView">
<section class="stats">
  <div class="tile"><b id="stTot">–</b><span>completati</span></div>
  <div class="tile"><b id="stYear">–</b><span id="stYearLbl">quest'anno</span></div>
  <div class="tile"><b id="stAvg">–</b><span>voto medio</span></div>
  <div class="tile years" id="years" title="Clic su un anno per filtrare"></div>
</section>

<section class="filters">
  <input type="search" id="q" placeholder="Cerca titolo…">
  <select id="fYear"><option value="">Tutti gli anni</option></select>
  <select id="fPlat"><option value="">Tutte le piattaforme</option></select>
  <select id="fVoto">
    <option value="">Tutti i voti</option>
    <option value="9">Da 9 in su</option>
    <option value="8">Da 8 in su</option>
    <option value="7">Da 7 in su</option>
    <option value="6">Da 6 in su</option>
    <option value="low">Sotto il 6</option>
    <option value="none">Senza voto</option>
  </select>
  <select id="sort">
    <option value="date">Più recenti</option>
    <option value="rating">Voto</option>
    <option value="title">Titolo</option>
    <option value="hours">Ore giocate</option>
  </select>
  <label style="display:flex;align-items:center;gap:6px;color:var(--muted)" title="Copertina mancante o abbinamento automatico incerto">
    <input type="checkbox" id="fCheck"> Da controllare <span id="nCheck"></span></label>
</section>

<main class="grid" id="grid"></main>
<div class="empty" id="empty" hidden>Nessun gioco.</div>
</div>

<div id="candView" hidden>
  <section class="syncbar" id="syncbar"></section>
  <section class="filters">
    <input type="search" id="cq" placeholder="Cerca titolo…">
    <select id="cStatus">
      <option value="new">Da valutare</option>
      <option value="dismissed">Non completati</option>
      <option value="confirmed">Già nel registro</option>
    </select>
    <select id="cSrc"><option value="">Tutte le fonti</option><option value="steam">Steam</option><option value="xbox">Xbox</option><option value="psn">PlayStation</option></select>
    <select id="cSig" title="Quanto è probabile che il gioco sia stato finito">
      <option value="strong">Indizio forte (fine storia, platino, 100%)</option>
      <option value="any">Anche solo ultimo achievement</option>
      <option value="">Tutti i giochi avviati</option>
    </select>
  </section>
  <div class="clist" id="clist"></div>
  <div class="empty" id="cempty" hidden>Niente da mostrare.</div>
</div>

<dialog id="dlg">
  <form class="edit" id="form" method="dialog">
    <label class="full">Titolo <input name="title" required maxlength="300"></label>
    <label>Piattaforma <input name="platform" required list="platList" maxlength="50"></label>
    <label>Completato il <input name="completed_on" type="date"></label>
    <label>Voto (0–10) <input name="rating" type="number" min="0" max="10" step="0.5"></label>
    <label>Ore giocate <input name="hours" type="number" min="0" step="0.1"></label>
    <div class="full" id="platInfo" style="font-size:13px;color:var(--muted)"></div>
    <label class="full">Note <textarea name="notes" rows="2" maxlength="5000"></textarea></label>
    <div class="igdb" id="igdbBox">
      <div class="cur" id="igdbCur"></div>
      <div style="display:flex; gap:8px">
        <input id="igdbQ" placeholder="Cerca su IGDB per cambiare copertina…" style="flex:1">
        <button type="button" id="igdbGo">Cerca</button>
      </div>
      <div class="results" id="igdbRes"></div>
    </div>
    <div class="actions full">
      <button type="button" class="danger left" id="btnDel">Elimina</button>
      <button type="button" id="btnCancel">Annulla</button>
      <button type="submit" class="primary">Salva</button>
    </div>
  </form>
</dialog>
<datalist id="platList"></datalist>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let games = [], cfg = {igdb: false}, editing = null;

const api = async (url, opts = {}) => {
  const r = await fetch(url, {headers: {'Content-Type': 'application/json'}, ...opts});
  if (!r.ok) {
    let msg = r.statusText;
    try { const j = await r.json(); msg = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); } catch {}
    throw new Error(msg);
  }
  return r.status === 204 ? null : r.json();
};
const toast = (msg, ms = 3000) => { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const year = g => g.completed_on ? g.completed_on.slice(0, 4) : '';
const fmtDate = d => d ? new Date(d + 'T00:00').toLocaleDateString('it-IT', {day: 'numeric', month: 'short', year: 'numeric'}) : 'data ?';
const scoreColor = v => v >= 8.5 ? 'var(--good)' : v >= 6.5 ? 'var(--mid)' : 'var(--bad)';
const doubtful = g => !g.igdb_id || !g.cover || (!g.match_manual && g.match_score != null && g.match_score < 0.85);
const fmtHours = h => h == null ? '' : h >= 10 ? `${Math.round(h)} h` : `${Number(h).toFixed(1).replace('.0', '')} h`;
const playLine = g => [g.hours != null ? `⏱ ${fmtHours(g.hours)}` : '', g.ach_total ? `🏆 ${g.ach_done}/${g.ach_total}` : '']
  .filter(Boolean).join(' · ');
const full = g => g.ach_total > 0 && g.ach_done >= g.ach_total;
// coppa con sfumatura platino (non l'emoji, che è dorata)
const PLAT_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#f4f6f8"/><stop offset=".5" stop-color="#b9c4ce"/><stop offset="1" stop-color="#eef1f4"/></linearGradient></defs>
  <path fill="url(#pg)" d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V17h3v2H8v-2h3v-2.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3V3Zm0 4H6v1a2 2 0 0 0 1 1.7V7Zm10 0v2.7A2 2 0 0 0 18 8V7h-1ZM6 20h12v2H6z"/></svg>`;
const avg = list => { const v = list.filter(g => g.rating != null); return v.length ? (v.reduce((a, g) => a + g.rating, 0) / v.length).toFixed(1) : '–'; };

async function load() {
  [games, cfg] = await Promise.all([api('/api/games'), api('/api/config')]);
  $('#btnCovers').hidden = !cfg.igdb;
  const years = [...new Set(games.map(year).filter(Boolean))].sort().reverse();
  const plats = [...new Set(games.map(g => g.platform))].sort();
  const keep = (sel, vals) => { const v = sel.value; sel.length = 1; vals.forEach(x => sel.add(new Option(x, x))); sel.value = vals.includes(v) ? v : ''; };
  keep($('#fYear'), years);
  keep($('#fPlat'), plats);
  $('#platList').innerHTML = plats.map(p => `<option value="${esc(p)}">`).join('');
  render();
}

function render() {
  const q = $('#q').value.trim().toLowerCase(), fy = $('#fYear').value, fp = $('#fPlat').value, fc = $('#fCheck').checked;
  const fv = $('#fVoto').value;
  const votoOk = g => !fv || (fv === 'none' ? g.rating == null : fv === 'low' ? g.rating != null && g.rating < 6 : g.rating != null && g.rating >= Number(fv));
  $('#nCheck').textContent = `(${games.filter(doubtful).length})`;
  let list = games.filter(g => (!fy || year(g) === fy) && (!fp || g.platform === fp) && (!fc || doubtful(g)) && votoOk(g)
    && (!q || g.title.toLowerCase().includes(q) || (g.igdb_name || '').toLowerCase().includes(q)));
  const s = $('#sort').value;
  if (s === 'rating') list.sort((a, b) => (b.rating ?? -1) - (a.rating ?? -1));
  else if (s === 'hours') list.sort((a, b) => (b.hours ?? -1) - (a.hours ?? -1));
  else if (s === 'title') list.sort((a, b) => (a.igdb_name || a.title).localeCompare(b.igdb_name || b.title));

  // riepilogo: totale e media seguono i filtri piattaforma/ricerca, il grafico anni no
  const thisYear = String(new Date().getFullYear());
  $('#stTot').textContent = list.length;
  $('#stYear').textContent = games.filter(g => year(g) === thisYear).length;
  $('#stYearLbl').textContent = `nel ${thisYear}`;
  $('#stAvg').textContent = avg(list);
  const counts = {};
  games.forEach(g => { const y = year(g); if (y) counts[y] = (counts[y] || 0) + 1; });
  const ys = Object.keys(counts).sort(), max = Math.max(1, ...Object.values(counts));
  $('#years').innerHTML = ys.map(y => `<div data-y="${y}" class="${y === fy ? 'sel' : ''}" title="${y}: ${counts[y]}">
      <em>${counts[y]}</em><i style="height:${Math.max(4, counts[y] / max * 56)}px"></i><small>'${y.slice(2)}</small></div>`).join('');
  $('#years').scrollLeft = $('#years').scrollWidth;

  $('#grid').innerHTML = list.map(g => {
    const name = g.igdb_name || g.title;
    const bg = g.cover ? `style="background-image:url('/covers/${encodeURIComponent(g.cover)}')"` : '';
    return `<div class="card" data-id="${g.id}">
      <div class="cover" ${bg}>${g.cover ? '' : esc(name)}
        ${full(g) ? `<span class="plat" title="Tutti gli achievement (${g.ach_done}/${g.ach_total})">${PLAT_SVG}</span>` : ''}
        ${doubtful(g) ? `<span class="warn" title="Abbinamento IGDB da controllare: apri la scheda">?</span>` : ''}
        ${g.rating != null ? `<span class="score" style="color:${scoreColor(g.rating)}">${g.rating}</span>` : ''}</div>
      <div class="meta"><div class="t" title="${esc(name)}">${esc(name)}</div>
        <div class="s"><span class="badge">${esc(g.platform)}</span>${fmtDate(g.completed_on)}</div>
        ${playLine(g) ? `<div class="s">${playLine(g)}</div>` : ''}</div>
    </div>`;
  }).join('');
  $('#empty').hidden = list.length > 0;
}

function openDialog(g) {
  editing = g;
  const f = $('#form');
  f.reset();
  f.elements.title.value = g?.title ?? '';
  f.platform.value = g?.platform ?? '';
  f.completed_on.value = g?.completed_on ?? new Date().toISOString().slice(0, 10);
  f.rating.value = g?.rating ?? '';
  f.hours.value = g?.manual_hours ?? '';
  f.hours.placeholder = g?.plat_hours != null ? `${g.plat_hours}` : '';
  const SRCN = {steam: 'Steam', xbox: 'Xbox', psn: 'PlayStation'};
  $('#platInfo').textContent = g?.plat_source
    ? `Dalla piattaforma (${SRCN[g.plat_source] || g.plat_source}): ${g.plat_hours != null ? fmtHours(g.plat_hours) : 'ore non disponibili'}`
      + (g.ach_total ? ` · ${g.ach_done}/${g.ach_total} achievement` : '') + (g.manual_hours != null ? ' — le ore scritte qui hanno la precedenza' : '')
    : '';
  f.notes.value = g?.notes ?? '';
  $('#btnDel').hidden = !g;
  $('#igdbBox').hidden = !g || !cfg.igdb;   // per un gioco nuovo l'abbinamento è automatico al salvataggio
  $('#igdbRes').innerHTML = '';
  if (g) {
    $('#igdbQ').value = g.title;
    $('#igdbCur').innerHTML = g.igdb_id
      ? `${g.cover ? `<img src="/covers/${encodeURIComponent(g.cover)}">` : ''}<span>Abbinato a IGDB: <b>${esc(g.igdb_name)}</b>${g.release_year ? ` (${g.release_year})` : ''}
         ${g.match_manual ? '· scelto a mano' : doubtful(g) ? '· <b style="color:var(--mid)">da controllare</b>: se è giusto, cliccalo qui sotto per confermarlo' : '· automatico'}</span>`
      : '<span>Non ancora abbinato a IGDB.</span>';
  }
  $('#dlg').showModal();
}

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  const body = {
    title: f.elements.title.value, platform: f.platform.value,
    completed_on: f.completed_on.value || null, rating: f.rating.value === '' ? null : Number(f.rating.value),
    hours: f.hours.value === '' ? null : Number(f.hours.value),
    notes: f.notes.value || null,
  };
  try {
    if (confirming) {
      const id = confirming.id;
      await api(`/api/candidates/${id}/confirm`, {method: 'POST', body: JSON.stringify(body)});
      $('#dlg').close();
      cands = cands.filter(x => x.id !== id);
      renderCands();
      loadSync();
      toast('Aggiunto al registro');
      await load();
      setTimeout(load, 2500);   // la copertina arriva da IGDB in background
      return;
    }
    if (editing) await api(`/api/games/${editing.id}`, {method: 'PUT', body: JSON.stringify(body)});
    else { await api('/api/games', {method: 'POST', body: JSON.stringify(body)}); setTimeout(load, 2500); }
    $('#dlg').close();
    await load();
  } catch (err) { toast('Errore: ' + err.message, 5000); }
});

$('#btnDel').onclick = async () => {
  if (!editing || !confirm(`Eliminare "${editing.title}"?`)) return;
  await api(`/api/games/${editing.id}`, {method: 'DELETE'});
  $('#dlg').close();
  await load();
};
$('#btnCancel').onclick = () => $('#dlg').close();
$('#btnAdd').onclick = () => openDialog(null);

async function igdbSearch() {
  const q = $('#igdbQ').value.trim();
  if (!q) return;
  $('#igdbRes').textContent = 'Cerco…';
  try {
    const res = await api('/api/igdb/search?q=' + encodeURIComponent(q) + '&platform=' + encodeURIComponent($('#form').platform.value));
    $('#igdbRes').innerHTML = res.length ? res.map(r => `<div data-igdb="${r.id}" title="${esc(r.platforms.join(', '))}">
        ${r.cover_id ? `<img loading="lazy" src="https://images.igdb.com/igdb/image/upload/t_cover_small/${r.cover_id}.jpg">` : '<span class="ph"></span>'}
        ${esc(r.name)}${r.year ? ` (${r.year})` : ''}</div>`).join('') : 'Nessun risultato.';
  } catch (err) { $('#igdbRes').textContent = 'Errore: ' + err.message; }
}
$('#igdbGo').onclick = igdbSearch;
$('#igdbQ').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); igdbSearch(); } });
$('#igdbRes').addEventListener('click', async e => {
  const d = e.target.closest('[data-igdb]');
  if (!d || !editing) return;
  try {
    editing = await api(`/api/games/${editing.id}/match`, {method: 'POST', body: JSON.stringify({igdb_id: Number(d.dataset.igdb)})});
    await load();
    openDialog(editing);
    toast('Copertina aggiornata');
  } catch (err) { toast('Errore: ' + err.message, 5000); }
});

$('#btnCovers').onclick = async () => {
  const b = $('#btnCovers');
  b.disabled = true; b.querySelector('.lbl-long').textContent = 'Abbino…';
  try {
    const r = await api('/api/covers/auto', {method: 'POST'});
    toast(`Abbinati ${r.matched}, da controllare ${r.doubtful}` + (r.not_found.length ? `, non trovati: ${r.not_found.join(', ')}` : ''), 8000);
    await load();
  } catch (err) { toast('Errore: ' + err.message, 5000); }
  b.disabled = false; b.querySelector('.lbl-long').textContent = 'Copertine mancanti';
};

$('#grid').addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (c) openDialog(games.find(g => g.id === Number(c.dataset.id)));
});
$('#years').addEventListener('click', e => {
  const d = e.target.closest('[data-y]');
  if (!d) return;
  $('#fYear').value = $('#fYear').value === d.dataset.y ? '' : d.dataset.y;
  render();
});
['#q', '#fYear', '#fPlat', '#fVoto', '#sort', '#fCheck'].forEach(s => $(s).addEventListener('input', render));

// --- dalle piattaforme ---------------------------------------------------------
const SRC = {steam: 'Steam', xbox: 'Xbox', psn: 'PlayStation'};
const SIG = {story: '🏁 Fine storia', platinum: '🏆 Platino', 100: '💯 Tutti gli achievement', last: '🕒 Ultimo achievement'};
const STRONG = new Set(['story', 'platinum', '100']);
let cands = [], confirming = null, syncTimer = null;

$('#tabReg').onclick = () => showTab('reg');
$('#tabCand').onclick = () => showTab('cand');
function showTab(t) {
  $('#tabReg').classList.toggle('on', t === 'reg');
  $('#tabCand').classList.toggle('on', t === 'cand');
  $('#regView').hidden = t !== 'reg';
  $('#candView').hidden = t !== 'cand';
  $('#btnAdd').hidden = $('#btnCovers').hidden = t !== 'reg';
  if (t === 'reg') $('#btnCovers').hidden = !cfg.igdb;
  if (t === 'cand') { loadSync(); loadCands(); }
}

async function loadSync() {
  const st = await api('/api/sync');
  let running = false, newCount = 0;
  $('#syncbar').innerHTML = Object.entries(st).map(([k, v]) => {
    running ||= v.status === 'running';
    newCount += v.strong || 0;
    const cls = v.status === 'error' ? 'err' : v.status === 'partial' ? 'part' : 'msg';
    const when = v.last_ok ? `ultima riuscita ${new Date(v.last_ok).toLocaleString('it-IT', {dateStyle: 'short', timeStyle: 'short'})}` : 'mai sincronizzato';
    return `<div class="src"><h3>${SRC[k]}
        ${v.configured ? `<button data-sync="${k}" ${v.status === 'running' ? 'disabled' : ''}>${v.status === 'running' ? 'In corso…' : 'Sincronizza'}</button>` : ''}</h3>
      ${v.configured
        ? `<div class="detail ${cls}">${esc(v.message || '')}</div><div class="msg">${when}${v.total ? ` · ${v.total} giochi, ${v.new || 0} da valutare` : ''}</div>`
        : '<div class="msg">Non configurato: credenziali mancanti nel .env</div>'}</div>`;
  }).join('');
  $('#nCand').textContent = newCount ? `(${newCount})` : '';
  clearTimeout(syncTimer);
  if (running) syncTimer = setTimeout(() => { loadSync(); loadCands(); }, 5000);
}
$('#syncbar').addEventListener('click', async e => {
  const b = e.target.closest('[data-sync]');
  if (!b) return;
  try { await api(`/api/sync/${b.dataset.sync}`, {method: 'POST'}); setTimeout(loadSync, 500); }
  catch (err) { toast('Errore: ' + err.message, 5000); }
});

async function loadCands() {
  cands = await api('/api/candidates?status=' + $('#cStatus').value);
  renderCands();
}
function renderCands() {
  const q = $('#cq').value.trim().toLowerCase(), src = $('#cSrc').value, sig = $('#cSig').value;
  const list = cands.filter(c => (!src || c.source === src) && (!q || c.title.toLowerCase().includes(q))
    && (sig === '' || (sig === 'any' ? c.signal : STRONG.has(c.signal))));
  const st = $('#cStatus').value;
  $('#clist').innerHTML = list.map(c => {
    const ach = c.ach_total ? `${c.ach_done}/${c.ach_total} achievement` : 'nessun achievement';
    const sigTxt = c.signal === 'last' ? `${SIG.last}: <i>${esc(c.signal_label)}</i> · ${fmtDate(c.signal_date)} <span style="color:var(--muted)">(indizio debole)</span>`
      : c.signal ? `${SIG[c.signal]}: <i>${esc(c.signal_label)}</i> · ${fmtDate(c.signal_date)}` : 'Nessun indizio di fine';
    const btns = st === 'new' ? `<button class="primary" data-ok="${c.id}">Completato</button><button data-dis="${c.id}">Non completato</button>`
      : st === 'dismissed' ? `<button data-res="${c.id}">Ripristina</button>` : '';
    return `<div class="cand">
      ${c.image_url ? `<img loading="lazy" src="${esc(c.image_url)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph'}))">` : '<span class="ph"></span>'}
      <div><div class="t">${esc(c.title)}</div>
        <div class="s"><span class="badge">${esc(c.platform)}</span>${c.hours != null ? `${c.hours} h · ` : ''}${ach}${c.last_played ? ` · ultimo avvio ${fmtDate(c.last_played)}` : ''}</div>
        <div class="sig ${c.signal ? '' : 'none'}">${sigTxt}</div></div>
      <div class="btns">${btns}</div></div>`;
  }).join('');
  $('#cempty').hidden = list.length > 0;
}
['#cq', '#cSrc', '#cSig'].forEach(s => $(s).addEventListener('input', renderCands));
$('#cStatus').addEventListener('input', loadCands);
$('#clist').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.ok) {
    const c = cands.find(x => x.id === Number(b.dataset.ok));
    confirming = c;
    openDialog(null);
    const f = $('#form');
    f.elements.title.value = c.title;
    f.platform.value = c.platform;
    f.completed_on.value = c.signal_date || c.last_played || '';
    f.notes.value = '';
    f.hours.placeholder = c.hours != null ? `${c.hours}` : '';
    $('#platInfo').textContent = (c.hours != null ? `Dalla piattaforma: ${fmtHours(c.hours)}` : '')
      + (c.ach_total ? ` · ${c.ach_done}/${c.ach_total} achievement` : '');
    f.rating.focus();
    return;
  }
  const id = b.dataset.dis || b.dataset.res;
  await api(`/api/candidates/${id}/${b.dataset.dis ? 'dismiss' : 'restore'}`, {method: 'POST'});
  cands = cands.filter(x => x.id !== Number(id));
  renderCands();
  loadSync();
});
$('#dlg').addEventListener('close', () => { confirming = null; });

load().then(() => api('/api/sync')).then(st => {
  const n = Object.values(st).reduce((a, v) => a + (v.strong || 0), 0);
  $('#nCand').textContent = n ? `(${n})` : '';
}).catch(err => toast('Errore nel caricamento: ' + err.message, 8000));
</script>
</body>
</html>
